name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (unsigned)
    # Xcode 26 or newer is required: the project sets
    # SWIFT_DEFAULT_ACTOR_ISOLATION = MainActor, which older Xcode versions
    # silently ignore, producing a wall of actor-isolation errors.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          swift --version

      # Signing is disabled so the build works without the upstream Apple
      # developer team. This only proves it compiles — it does not produce a
      # runnable, notarized app.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project slapss.xcodeproj \
            -scheme slapss \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | { command -v xcbeautify >/dev/null && xcbeautify || cat; }
        env:
          NSUnbufferedIO: YES
